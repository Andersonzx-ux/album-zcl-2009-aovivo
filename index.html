<!DOCTYPE html>
<html lang="pt-BR" data-disc="1">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090B0A" id="meta-theme-color">
    <title>Duas Horas de Sucesso — Zezé Di Camargo &amp; Luciano</title>
    <link rel="icon" type="image/jpeg" href="./assets/cover-256.jpg">
    <link rel="preload" href="assets/fonts/marcellus-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/jost-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/cover1.jpg" as="image">
    <link rel="preload" href="assets/cover2.jpg" as="image">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Luz de palco: acompanha a cor do disco atual -->
    <div class="glow" aria-hidden="true"></div>

    <main class="app">
        <nav class="topbar" aria-label="Seções">
            <button id="btn-about" class="pill" type="button">Sobre</button>
            <button id="btn-awards" class="pill" type="button">Premiações</button>
            <button id="btn-credits" class="pill" type="button">Ficha técnica</button>
        </nav>

        <div class="stage-row">
            <header class="hero">
                <h1 class="sr-only" id="album-title">Duas Horas de Sucesso — Ao Vivo</h1>

                <!-- A capa do disco atual se dissolve no palco preto. O relógio da capa é o dial de progresso. -->
                <div class="hero-stack" id="hero-stack">
                    <div class="hero-art xf" id="hero-xf" aria-hidden="true">
                        <img class="xf-a on" alt="" decoding="async">
                        <img class="xf-b" alt="" decoding="async">
                    </div>
                    <svg class="dial" id="dial" viewBox="0 0 640 576" aria-hidden="true">
                        <g class="dial-pos" id="dial-pos">
                            <g id="dial-ticks"></g>
                            <circle class="dial-face" id="dial-face" cx="0" cy="0" r="100"/>
                            <circle class="dial-hit" id="dial-hit" cx="0" cy="0" r="118"/>
                        </g>
                    </svg>
                </div>
                <p class="meta" id="album-meta"></p>
            </header>

            <section class="player" aria-label="Player de áudio">
                <div class="disc-switch" role="group" aria-label="Disco">
                    <button type="button" class="disc-btn" data-disc="1" aria-pressed="true"><span class="disc-btn-name">Disco 1</span><small class="disc-btn-range"></small></button>
                    <button type="button" class="disc-btn" data-disc="2" aria-pressed="false"><span class="disc-btn-name">Disco 2</span><small class="disc-btn-range"></small></button>
                </div>

                <div class="now-playing">
                    <p class="now-kicker" id="current-kicker">Faixa</p>
                    <h2 id="current-title">Selecione uma faixa</h2>
                    <p id="current-composers" class="credit">--</p>
                </div>

                <div class="seek">
                    <span id="time-current" class="time">00:00</span>
                    <input type="range" id="progress-bar" min="0" max="100" step="0.1" value="0" aria-label="Progresso da faixa">
                    <span id="time-total" class="time">00:00</span>
                </div>

                <div class="controls">
                    <button id="btn-shuffle" class="control-btn" type="button" aria-label="Modo aleatório" title="Aleatório"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
                    <button id="btn-prev" class="control-btn" type="button" aria-label="Faixa anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                    <button id="btn-play-pause" class="control-btn play-btn" type="button" aria-label="Tocar"></button>
                    <button id="btn-next" class="control-btn" type="button" aria-label="Próxima faixa"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                    <button id="btn-repeat" class="control-btn" type="button" aria-label="Repetir: desligado" title="Repetir"></button>
                </div>

                <div class="volume-control" title="Volume">
                    <span class="volume-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span>
                    <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" aria-label="Volume">
                </div>

                <audio id="audio-element" preload="none"></audio>
            </section>
        </div>

        <!-- Faixa de luz do palco (recortada da capa), troca junto com o disco -->
        <div class="stage-band xf" id="band-xf" aria-hidden="true">
            <img class="xf-a on" alt="" decoding="async">
            <img class="xf-b" alt="" decoding="async">
        </div>

        <div class="content-split">
            <section class="tracklist-section" aria-label="Faixas">
                <ul id="tracklist" class="tracklist"></ul>
            </section>

            <section class="lyrics-section" id="lyrics-section" aria-label="Letra da música">
                <div class="lyrics-header">
                    <div class="lyrics-header-text">
                        <h3 id="lyrics-title">Letra</h3>
                        <p id="lyrics-composers" class="credit"></p>
                    </div>
                    <div class="lyrics-actions">
                        <button id="btn-translation" class="lyrics-toggle-btn lyrics-tr-btn" type="button" aria-pressed="true" aria-label="Mostrar tradução" title="Esta faixa ainda não tem tradução">PT</button>
                        <button id="btn-expand-lyrics" class="lyrics-toggle-btn" type="button" aria-pressed="false" aria-label="Letra em tela cheia" title="Tela cheia">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                        </button>
                        <button id="btn-toggle-lyrics" class="lyrics-toggle-btn" type="button" aria-expanded="true" aria-controls="lyrics-content" aria-label="Esconder letra">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
                        </button>
                    </div>
                </div>
                <div id="lyrics-content" class="lyrics-content">
                    <p class="empty-state">Selecione uma música para ver a letra.</p>
                </div>
            </section>
        </div>
    </main>

    <dialog id="modal-about" class="modal">
        <div class="modal-content">
            <button class="close-modal" type="button" aria-label="Fechar">✕</button>
            <h2>Sobre o álbum</h2>
            <div id="about-content" class="modal-body"></div>
        </div>
    </dialog>

    <dialog id="modal-awards" class="modal">
        <div class="modal-content">
            <button class="close-modal" type="button" aria-label="Fechar">✕</button>
            <h2>Premiações</h2>
            <div id="awards-content" class="modal-body"></div>
        </div>
    </dialog>

    <dialog id="modal-credits" class="modal">
        <div class="modal-content">
            <button class="close-modal" type="button" aria-label="Fechar">✕</button>
            <h2>Ficha técnica</h2>
            <div id="credits-content" class="modal-body"></div>
        </div>
    </dialog>

    <script src="data/album.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
